<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get a solar quote | Lumenfield Home Energy</title>
<!-- Web-to-Lead form for the Accord demo org. Posts to Salesforce; creates a Lead
     routed by Accord Lead Routing to the Inbound Leads queue. US-16. -->
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f7f6;color:#1d2b28;margin:0}
  main{max-width:520px;margin:40px auto;background:#fff;padding:32px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  h1{color:#0B5F55;margin-top:0;font-size:1.6rem} p.lede{color:#4a5a57;margin-top:-8px}
  label{display:block;font-weight:600;margin:16px 0 6px;font-size:.9rem}
  input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c9d4d1;border-radius:8px;font:inherit}
  .row{display:flex;gap:12px}.row>div{flex:1}
  button{margin-top:24px;width:100%;padding:12px;background:#0B5F55;color:#fff;border:0;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
  small{display:block;color:#6b7a77;margin-top:14px}
</style>
</head>
<body>
<main>
  <h1>Get a solar quote</h1>
  <p class="lede">Tell us about your home and a Lumenfield advisor will reach out within one business day.</p>
  <form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00Daj000019A1GT" method="POST">
    <input type="hidden" name="oid" value="00Daj000019A1GT">
    <input type="hidden" name="retURL" value="https://www.example.com/thanks">
    <input type="hidden" name="lead_source" value="Web">
    <input type="hidden" name="company" value="Household">
    <div class="row">
      <div><label for="first_name">First name</label><input id="first_name" name="first_name" maxlength="40" type="text"></div>
      <div><label for="last_name">Last name</label><input id="last_name" name="last_name" maxlength="80" type="text" required></div>
    </div>
    <label for="email">Email</label><input id="email" name="email" maxlength="80" type="email">
    <label for="phone">Phone</label><input id="phone" name="phone" maxlength="40" type="tel">
    <label for="00Naj00005r4Rq9">Service address</label><input id="00Naj00005r4Rq9" name="00Naj00005r4Rq9" maxlength="255" type="text">
    <label for="00Naj00005r48tH">Area</label>
    <select id="00Naj00005r48tH" name="00Naj00005r48tH">
      <option value="">Choose one</option>
      <option value="Louisville Metro">Louisville Metro</option>
      <option value="Southern Indiana">Southern Indiana</option>
      <option value="Central Kentucky">Central Kentucky</option>
      <option value="Other">Other</option>
    </select>
    <label for="00Naj00005r4SHZ">What would you like to know?</label><textarea id="00Naj00005r4SHZ" name="00Naj00005r4SHZ" rows="4" maxlength="500"></textarea>
    <button type="submit">Request my quote</button>
    <small>We need an email or a phone number to follow up. Demo form for a fictional company; no real data is collected.</small>
  </form>
</main>
</body>
</html>
